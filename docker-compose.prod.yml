services:
  api:
    image: ghcr.io/arie-chocron/grainy-api:${IMAGE_TAG:?Set IMAGE_TAG to a published image tag}
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://arie-chocron.github.io}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://api:8000
    depends_on:
      api:
        condition: service_healthy
